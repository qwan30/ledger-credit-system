name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  legacy-build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ledger_credit_system
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledger_credit_system"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ledger_credit_system?schema=public
      JWT_SECRET: ci-secret-placeholder
      SUPPORTED_CURRENCIES: USD
      BUSINESS_TIMEZONE: UTC
      CLOSE_WINDOW_CRON: 0 0 * * *
      BATCH_SHARD_SIZE: 500
      SCORE_APPROVE_THRESHOLD: 700
      SCORE_REJECT_THRESHOLD: 550
      RATE_LIMIT_MAX: 100
      RATE_LIMIT_WINDOW_MS: 60000
      EXTERNAL_RAIL_DEFAULT_PROVIDER: simulator
      EXTERNAL_RAIL_CALLBACK_SECRET: ci-callback-secret
      EXTERNAL_SIMULATOR_SETTLEMENT_DELAY_MS: 10
      INTEREST_RATE_BPS: 250
      AUTH_ACCESS_TTL_SECONDS: 900
      AUTH_REFRESH_TTL_SECONDS: 604800
      AUTH_INTERNAL_ISSUER: ledger-credit-system
      AUTH_CUSTOMER_AUDIENCE: customer-api
      AUTH_OPERATOR_AUDIENCE: ops-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:full

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run contracts:check

  api-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -f apps/api-java/pom.xml test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run contracts:generate
      - run: npm run web:typecheck
      - run: npm run web:lint
      - run: npm run web:test
      - run: npm run web:build

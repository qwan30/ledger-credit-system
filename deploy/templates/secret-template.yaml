apiVersion: v1
kind: Secret
metadata:
  name: <SECRET_NAME>
  namespace: <APP_NAMESPACE>
type: Opaque
data:
  DATABASE_URL: <BASE64_DATABASE_URL>
  JWT_SECRET: <BASE64_JWT_SECRET>
  AUTH_ACCESS_TTL_SECONDS: <BASE64_ACCESS_TTL>
  AUTH_REFRESH_TTL_SECONDS: <BASE64_REFRESH_TTL>
  AUTH_INTERNAL_ISSUER: <BASE64_INTERNAL_ISSUER>
  AUTH_CUSTOMER_AUDIENCE: <BASE64_CUSTOMER_AUDIENCE>
  AUTH_OPERATOR_AUDIENCE: <BASE64_OPERATOR_AUDIENCE>
  AUTH_OIDC_ISSUER: <BASE64_OIDC_ISSUER>
  AUTH_OIDC_JWKS_URI: <BASE64_OIDC_JWKS_URI>
  AUTH_OIDC_AUDIENCE: <BASE64_OIDC_AUDIENCE>
